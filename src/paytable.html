<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paytable — HTML5 Slot Machine</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
    />
    <style>
      :root {
        --gold: #d9a635;
        --gold-bright: #f5cf6b;
        --gold-deep: #8a5a1a;
        --stone-dark: #1c1108;
        --stone-darker: #100a04;
        --parchment: #f0dfb4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--stone-darker);
        font-family: "Cinzel", serif;
        color: var(--parchment);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.25rem;
        background: linear-gradient(
          to bottom,
          var(--stone-dark),
          rgba(28, 17, 8, 0.92)
        );
        border-bottom: 1px solid var(--gold-deep);
      }

      header h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        color: var(--gold-bright);
        text-shadow: 0 0 8px rgba(217, 166, 53, 0.35);
      }

      header a.back-link {
        color: var(--gold);
        text-decoration: none;
        font-size: 0.85rem;
        border: 1px solid var(--gold-deep);
        border-radius: 6px;
        padding: 0.35rem 0.7rem;
        transition: background 0.2s ease;
      }

      header a.back-link:hover {
        background: rgba(217, 166, 53, 0.12);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 1.5rem 1rem 3rem;
      }

      .page-wrap {
        max-width: 900px;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      canvas {
        width: 100%;
        height: auto;
        max-width: 900px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        user-select: none;
        -webkit-user-drag: none;
      }

      #status {
        color: var(--gold);
        font-size: 0.95rem;
        padding: 3rem 1rem;
        text-align: center;
      }

      noscript {
        display: block;
        color: var(--gold);
        text-align: center;
        padding: 3rem 1rem;
      }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <header>
      <h1>Paytable</h1>
      <a class="back-link" href="./">&larr; Back to the game</a>
    </header>

    <main id="viewer">
      <p id="status">Loading paytable…</p>
    </main>

    <noscript>
      JavaScript is required to view the paytable on this page.
    </noscript>
  </body>
</html>
